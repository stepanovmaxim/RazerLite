name: build and release

# Pushing a version tag builds the utility and publishes RazerLite.exe as the
# release asset. That asset is exactly what the built-in updater downloads, so
# a tag is all it takes to roll a new version out to everyone running it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Check that it produced something
        shell: cmd
        run: |
          if not exist RazerLite.exe exit /b 1
          dir RazerLite.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RazerLite
          path: |
            RazerLite.exe
            RazerLite.map

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" RazerLite.exe \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" RazerLite.exe --clobber
